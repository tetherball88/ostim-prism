; Key codes for toggling UI Focus (Default: Left Alt (56))
ToggleFocus = 56

; Key code for toggling Inspector (Default: Right Ctrl (157))
; ToggleInspector = 157

[UIBehaviour]
; How many seconds of inactivity (no OStim key presses) before Prism UI auto-hides.
; Set to 0 to disable idle hiding. (Default: 30)
; IdleTimeoutSeconds = 30

