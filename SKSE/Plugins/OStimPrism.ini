[Hotkeys]
; keycodes - https://www.nexusmods.com/skyrimspecialedition/articles/7704
; Key codes for toggling UI Focus (Default: Left Alt (56))
ToggleFocus = 56

; Key code for toggling Inspector (Default: Right Ctrl (157))
; ToggleInspector = 157

[UIBehaviour]
; Display navigation and utility option menus as an icon grid with a bottom item name bar.
; Set to 0 to use the classic vertical list layout. (Default: 1)
EnableGridMenu = 1

; Number of columns in the icon grid when EnableGridMenu = 1 (e.g. 3, 4, 5, etc. Default: 4)
GridColumns = 4

; Number of visible rows in the icon grid when EnableGridMenu = 1 (Default: 4)
GridRows = 4

; Position (pixels from left/bottom, -1 = default) and scale (%) of the Main HUD block (buttons + menus)
MainBlockX = -1
MainBlockY = -1
MainBlockScale = 100

; Position (pixels from left/bottom, -1 = default) and scale (%) of the Excitement Bars block
ExcitementBlockX = -1
ExcitementBlockY = -1
ExcitementBlockScale = 100

; Render 3D participant portraits inside excitement circles when Phantasm is installed.
; Falls back to orgasm count when disabled (0) or when Phantasm is not installed. (Default: 1)
; EnablePortraits = 1

; How many seconds of inactivity (no OStim key presses) before Prism UI auto-hides.
; Set to 0 to disable idle hiding. (Default: 30)
; IdleTimeoutSeconds = 30

; Comma-separated list of menu names that hide the Prism UI when opened.
; Leave commented out to use defaults. Custom/mod menu names can be added here.
; Default:
;   InventoryMenu, ContainerMenu, Journal Menu, MagicMenu, MapMenu, FavoritesMenu,
;   Dialogue Menu, Sleep/Wait Menu, Lockpicking Menu, BarterMenu, GiftMenu,
;   Book Menu, Crafting Menu, RaceSex Menu, Console
; TrackedMenus = InventoryMenu, ContainerMenu, Journal Menu, MagicMenu, MapMenu, FavoritesMenu, Dialogue Menu, Sleep/Wait Menu, Lockpicking Menu, BarterMenu, GiftMenu, Book Menu, Crafting Menu, RaceSex Menu, Console
